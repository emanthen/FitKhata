name: security

# Runs on every PR (fast jobs) and nightly (gitleaks' full-history scan is
# the one job deliberately skipped on PRs — see its own job comment).
on:
  pull_request:
  schedule:
    - cron: "15 20 * * *" # ~01:00 NPT
  workflow_dispatch:

permissions: read-all

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history only on the nightly/manual run — a PR's own diff
          # is covered by gitleaks' default incremental mode, and cloning
          # the whole repo on every PR push is wasted cost.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Scan apps/api
        run: |
          uvx semgrep scan \
            --config p/django --config p/python --config p/secrets --config p/owasp-top-ten \
            --exclude '.venv' --exclude 'tests' --exclude '*/tests' \
            --sarif --output semgrep-api.sarif apps/api
      - name: Scan apps/web
        run: |
          uvx semgrep scan \
            --config p/typescript --config p/react --config p/nextjs --config p/secrets \
            --exclude 'node_modules' --exclude '.next' \
            --sarif --output semgrep-web.sarif apps/web
      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        if: always()
        with:
          sarif_file: semgrep-api.sarif
          category: semgrep-api
      - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        if: always()
        with:
          sarif_file: semgrep-web.sarif
          category: semgrep-web
      - name: Fail on findings
        run: |
          uvx semgrep scan --config p/django --config p/python --config p/secrets --config p/owasp-top-ten \
            --exclude '.venv' --exclude 'tests' --exclude '*/tests' --error apps/api
          uvx semgrep scan --config p/typescript --config p/react --config p/nextjs --config p/secrets \
            --exclude 'node_modules' --exclude '.next' --error apps/web

  bandit-pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          working-directory: apps/api
      - run: uv python install 3.12
        working-directory: apps/api
      - run: uv sync
        working-directory: apps/api
      - run: uv run bandit -c pyproject.toml -r . -ll
        working-directory: apps/api
      - run: uv run pip-audit
        working-directory: apps/api

  pnpm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PNPM_VERSION: "10.33.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

  trivy-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ matrix.app }}
          target: runtime
          push: false
          load: true
          tags: fitkhata-${{ matrix.app }}:security-scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fitkhata-${{ matrix.app }}:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-infra-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "1"

  zap-baseline:
    # NOTE: written correctly against the real dev compose stack, but its
    # first actual execution is in GitHub's own runners — standing up the
    # full stack (migrate + seed + api + web) needs more than this
    # environment's Docker-with-flaky-registry-access could reliably
    # exercise end to end this session. If this job needs adjusting once
    # it actually runs, that's expected; it's not a result I've observed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the dev stack
        run: |
          docker compose -f infra/docker-compose.dev.yml up -d postgres redis minio
          docker compose -f infra/docker-compose.dev.yml run --rm api python manage.py migrate
          docker compose -f infra/docker-compose.dev.yml run --rm api python manage.py seed_demo
          docker compose -f infra/docker-compose.dev.yml up -d api web
        env:
          DJANGO_SECRET_KEY: zap-baseline-ci-only
          FIELD_ENCRYPTION_KEY: ${{ secrets.ZAP_CI_FIELD_ENCRYPTION_KEY }}
      - name: Wait for the web app to answer
        run: |
          for _ in $(seq 1 30); do
            curl -fs http://localhost:3000 && break
            sleep 2
          done
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:3000"
          fail_action: true
          cmd_options: "-I" # medium+ only; H1's own ask

  sbom:
    # Attached to releases, not every PR -- only main pushes and tags.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ matrix.app }}
          target: runtime
          push: false
          load: true
          tags: fitkhata-${{ matrix.app }}:sbom
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: fitkhata-${{ matrix.app }}:sbom
          artifact-name: sbom-${{ matrix.app }}.spdx.json
