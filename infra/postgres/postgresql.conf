# Tuned for an 8 GB RAM VPS running Postgres alongside the rest of the
# FitKhata stack (see infra/docker-compose.yml memory limits). Anything not
# set here falls back to Postgres's compiled-in default.

listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 100

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# pg_stat_statements — query stats for monitoring/debugging.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# WAL / continuous archiving to R2 via WAL-G (infra/postgres/Dockerfile).
# WAL-G reads its AWS_*/WALG_* config from the environment of this process.
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 60
max_wal_size = 2GB
min_wal_size = 512MB

logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500

# Must stay last: resolves to $PGDATA/postgresql.auto.conf. Without this,
# ALTER SYSTEM and scripts/restore.sh's restore_command override would be
# silently ignored, since this file lives outside PGDATA.
include_if_exists = 'postgresql.auto.conf'
